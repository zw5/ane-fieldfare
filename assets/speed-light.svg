.title { font-size: 16px; font-weight: 600; }
.group { font-size: 13px; font-weight: 600; }
.name, .value { font-size: 13px; }
.strong { font-weight: 600; }
.muted, .tick, .note { fill: #59636e; }
.muted { font-size: 13px; }
.tick { font-size: 11px; }
.note { font-size: 11px; }
.grid { stroke: #d1d9e0; stroke-width: 1; }
</style>
