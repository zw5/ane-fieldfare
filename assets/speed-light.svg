<svg xmlns="http://www.w3.org/2000/svg" width="880" height="308" viewBox="0 0 880 308" role="img" aria-labelledby="t d">
<title id="t">ANE Fieldfare against Turbo Fieldfare and llama.cpp</title>
<desc id="d">Greedy generation on a math prompt: ANE Fieldfare 96.6 tokens per second, Turbo Fieldfare 24 to 25, llama.cpp 5 to 9. Temperature 0.2: ANE Fieldfare 36 to 53, Turbo Fieldfare 21 to 25. First token on a 3,015-token prompt: ANE Fieldfare 10 seconds, Turbo Fieldfare 48, llama.cpp about 110 (estimated).</desc>
<defs><pattern id="hatch-0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#caddf5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2a78d6" stroke-width="3"/></pattern><pattern id="hatch-1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fad9cc"/><line x1="0" y1="0" x2="0" y2="6" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="hatch-2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#c6ebde"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1baf7a" stroke-width="3"/></pattern></defs>
<style>
