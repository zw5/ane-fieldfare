<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t">
<title id="t">ANE Fieldfare logo: a fieldfare in goggles riding a flaming Neural Engine chip</title>
<defs>
  <radialGradient id="sky" cx="0.55" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#23305c"/>
    <stop offset="1" stop-color="#0b0f1d"/>
  </radialGradient>
  <linearGradient id="chipTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4a525e"/>
    <stop offset="1" stop-color="#2c3139"/>
  </linearGradient>
  <linearGradient id="breast" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eaa65a"/>
    <stop offset="0.45" stop-color="#f4dcab"/>
    <stop offset="1" stop-color="#fbf1dc"/>
  </linearGradient>
  <radialGradient id="lens" cx="0.35" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#ffe08a"/>
    <stop offset="1" stop-color="#e8862a"/>
  </radialGradient>
  <clipPath id="badge"><circle cx="256" cy="256" r="244"/></clipPath>
</defs>

<circle cx="256" cy="256" r="248" fill="url(#sky)"/>
<g clip-path="url(#badge)">
  <!-- stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="120" cy="110" r="2"/><circle cx="400" cy="120" r="1.6"/>
    <circle cx="330" cy="70" r="1.4"/><circle cx="90" cy="200" r="1.2"/>
    <circle cx="440" cy="230" r="1.8"/><circle cx="200" cy="60" r="1.2"/>
  </g>

  <g transform="translate(-22,-100) scale(1.16)">
  <!-- speed lines -->
  <g stroke="#9fb4ff" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <line x1="60" y1="420" x2="150" y2="408"/>
    <line x1="110" y1="450" x2="230" y2="434"/>
    <line x1="300" y1="430" x2="380" y2="420"/>
  </g>

  <!-- flames out of the back of the chip -->
  <path fill="#e5482f" d="M178,318 C150,300 120,306 92,286 C104,304 96,312 54,314 C84,326 76,336 18,344 C70,356 64,368 30,392 C76,386 96,396 60,428 C110,418 140,412 120,452 C160,426 182,414 196,400 Z"/>
  <path fill="#f5872a" d="M182,328 C158,316 136,320 116,306 C124,322 114,330 82,334 C106,344 100,352 60,362 C100,368 98,378 72,398 C108,392 128,396 104,420 C140,412 160,408 152,432 C176,412 188,404 196,394 Z"/>
  <path fill="#ffd23f" d="M186,340 C168,334 152,338 138,330 C142,342 134,348 112,352 C130,360 128,366 102,376 C130,378 134,384 116,398 C142,394 156,396 146,412 C170,402 184,396 196,388 Z"/>
  <path fill="#fff4c2" d="M190,352 C176,350 166,352 156,348 C160,356 154,360 140,364 C156,368 156,372 144,380 C162,380 176,380 196,384 Z"/>
  <g fill="#ffd23f">
    <circle cx="40" cy="300" r="4"/><circle cx="14" cy="372" r="3"/><circle cx="84" cy="446" r="3.5"/><circle cx="60" cy="270" r="2.5"/>
  </g>

  <!-- the chip, a slab in perspective -->
  <polygon points="150,330 190,378 190,398 150,350" fill="#1d2127"/>
  <polygon points="190,378 432,344 432,364 190,398" fill="#23272e"/>
  <g fill="#c9d1da">
    <rect x="204" y="396" width="8" height="10" transform="skewY(-8) translate(0,30)"/>
    <rect x="232" y="392" width="8" height="10" transform="skewY(-8) translate(0,30)"/>
    <rect x="260" y="388" width="8" height="10" transform="skewY(-8) translate(0,30)"/>
    <rect x="288" y="384" width="8" height="10" transform="skewY(-8) translate(0,30)"/>
    <rect x="316" y="380" width="8" height="10" transform="skewY(-8) translate(0,30)"/>
    <rect x="344" y="376" width="8" height="10" transform="skewY(-8) translate(0,30)"/>
    <rect x="372" y="372" width="8" height="10" transform="skewY(-8) translate(0,30)"/>
    <rect x="400" y="368" width="8" height="10" transform="skewY(-8) translate(0,30)"/>
  </g>
  <polygon points="150,330 392,298 432,344 190,378" fill="url(#chipTop)"/>
  <polygon points="214,330 360,311 380,336 234,356" fill="#15181d" stroke="#d9a441" stroke-width="2"/>
  <text x="0" y="0" transform="translate(268,347) skewX(-30) rotate(-7)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#d9a441" letter-spacing="3">ANE</text>

  <!-- scarf tails streaming back, behind the bird -->
  <path fill="#b52b2b" d="M324,234 C300,214 272,222 246,200 C252,216 242,222 220,218 C244,236 276,236 316,246 Z"/>
  <path fill="#d63a3a" d="M326,238 C304,226 280,236 254,222 C262,236 254,244 232,246 C258,256 290,250 318,248 Z"/>
  <!-- tail -->
  <path fill="#2f343b" d="M236,268 L176,262 L184,276 L170,288 L232,292 Z"/>

  <!-- body -->
  <ellipse cx="290" cy="270" rx="66" ry="44" transform="rotate(-14 290 270)" fill="#8a4b2a"/>
  <path fill="url(#breast)" d="M346,232 C364,262 352,300 310,312 C282,318 258,308 250,296 C290,298 330,276 346,232 Z"/>
  <g fill="#3b2a20">
    <path d="M318,262 l5,8 l-8,0 z"/><path d="M332,276 l5,8 l-8,0 z"/>
    <path d="M306,282 l5,8 l-8,0 z"/><path d="M322,292 l5,8 l-8,0 z"/>
    <path d="M290,296 l5,8 l-8,0 z"/><path d="M340,256 l5,8 l-8,0 z"/>
    <path d="M308,302 l4,6 l-7,0 z"/>
  </g>
  <!-- legs -->
  <g stroke="#5a3a26" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M288,304 L280,330 M280,330 L268,334 M280,330 L292,334"/>
    <path d="M314,304 L314,326 M314,326 L302,330 M314,326 L326,328"/>
  </g>

  <!-- wing -->
  <path fill="#6e3a20" d="M300,246 C280,240 250,250 232,270 C254,272 282,272 300,262 C306,258 306,250 300,246 Z"/>
  <path fill="none" stroke="#4e2814" stroke-width="2" d="M244,268 C262,264 280,262 296,256"/>

  <!-- scarf band round the neck -->
  <path fill="#d63a3a" d="M318,230 C332,240 352,244 370,238 L374,250 C354,258 330,256 314,246 Z"/>
  <!-- head -->
  <circle cx="348" cy="214" r="36" fill="#8f99a5"/>
  <path fill="#7c8692" d="M318,200 C330,176 366,172 380,196 C362,186 336,188 318,200 Z"/>
  <!-- beak -->
  <path fill="#f2b632" d="M378,214 L408,222 L378,230 Z"/>
  <path fill="#2b2b2b" d="M398,219 L408,222 L398,225 Z"/>
  <!-- goggles -->
  <path stroke="#2a2a2a" stroke-width="7" fill="none" d="M316,206 C326,198 342,196 352,200"/>
  <circle cx="360" cy="206" r="14" fill="#3a3a3a"/>
  <circle cx="360" cy="206" r="10" fill="url(#lens)"/>
  <circle cx="356" cy="202" r="3" fill="#ffffff" opacity="0.9"/>
  </g>
</g>
<circle cx="256" cy="256" r="246" fill="none" stroke="#d9a441" stroke-width="4" opacity="0.8"/>
</svg>
